// woods/qrack HUD for ezQuake
// Needs gfx/sbar.* + gfx/ibar.* present (see ezquake/gfx/).
//
// This HUD uses absolute pixel offsets, so it only holds still if the console
// resolution is pinned. With both cvars at 0 (the default) ezQuake derives
// conwidth AND conheight from the live window size (vid_sdl2.c:1874), so the
// layout shifts every time you resize or toggle fullscreen. Uncomment to pin:
//
// vid_conwidth  "512"
// vid_conheight "384"


