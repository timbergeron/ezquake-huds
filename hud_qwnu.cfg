// --- team header boxes -------------------------------------------------------------
// The hub (PlayerInfo.tsx) draws each team header as "name [frags]", the frags in a box
// filled with the team's colours. hud_teamfrags is the only ezQuake element that draws
// real team colours, and it is ONE element, so its two boxes sit a fixed distance apart.
// Tuned for 4on4: teaminfo rows are 8 * scale 1.5 = 12 units, so the second header is
// (1 header + 4 players + 1 header_spacing) * 12 = 72 below the first. A vertical
// teamfrags puts cell 0 at +space_y and cell 1 a further cell_height + space_y below:
// 12 + 60 = 72. In 2on2 the second box lands two rows below its header.
// The box is drawn over teaminfo's own "- frags" text (hud.c raises a child's draw order
// above its parent's); teaminfo still prints the team name at the left of the row.
// This replaces the hub's top-centre score box, which would need a second teamfrags.
hud_teamfrags_show                    "1"
hud_teamfrags_place                   "teaminfo"
hud_teamfrags_align_x                 "right"
hud_teamfrags_align_y                 "top"
hud_teamfrags_pos_x                   "0"
hud_teamfrags_pos_y                   "-60"
hud_teamfrags_vertical                "1"
hud_teamfrags_rows                    "2"
hud_teamfrags_cols                    "1"
hud_teamfrags_cell_height             "12"
hud_teamfrags_cell_width              "32"
hud_teamfrags_space_x                 "0"
hud_teamfrags_space_y                 "60"
hud_teamfrags_shownames               "0"
hud_teamfrags_extra_spec_info         "0"
// style 3 = no own-team marker (upstream Frags_DrawColors "Draw nothing")
hud_teamfrags_style                   "3"
hud_teamfrags_bignum                  "0"
hud_teamfrags_scale                   "1.5"
hud_teamfrags_proportional            "1"
hud_teamfrags_colors_alpha            "1"
hud_teamfrags_item_opacity            "1"
hud_teamfrags_frame                   "0"
hud_teamfrags_strip                   "0"
hud_teamfrags_onlytp                  "0"

hud_recalculate
