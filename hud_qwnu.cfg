gl_consolefont                        "povo5f_xtm"
crosshairimage                        "xtm_dot"
crosshaircolor                        "0 255 0"
r_tracker_frags                       "2"
r_tracker_messages                    "10"
cl_useimagesinfraglog                 "1"
scr_teaminfo                          "0"

