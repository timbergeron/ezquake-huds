// hud_qwnu.cfg - the hud.qw.nu / QuakeWorld Hub HUD for ezQuake
//
// Layout: the hub's own HUD block from quakeworldnu/hub.quakeworld.nu
//   public/assets/fte/config_qtv_v5.cfg, run by FTE's ezhud plugin (plug_sbar 3),
//   with its FTE-only variables resolved:
//     $_fte_margin = 12   $_fte_nmargin = -12   $_fte_weapon_scale = 1.5
// Team overlay: HTML on the hub (PlayerInfo.tsx), rebuilt below with hud_teaminfo,
//   hud_teamfrags colour boxes on the team headers, and a TrueType font. The hub's
//   top-centre score box (Participants.tsx) is not reproduced; see the teamfrags block.
// Art: the hub's own FTE asset set, listed in src/pages/games/fte/assets.ts and
//   served from https://a.quake.world/fte/id1/...  (gfx/*.png, povo5f_xtm charset,
//   xtm_dot crosshair, tracker icons).

// Reset every hud_* cvar first, otherwise elements this file does not mention
// keep whatever config.cfg last saved. ^hud_ is a regex per IsRegexp().
cvar_reset_re ^hud_

