// ================= team overlay: hub PlayerInfo.tsx reproduced =================
// On hub.quakeworld.nu this panel is HTML (src/pages/games/player/controls/PlayerInfo.tsx),
// Roboto Bold 700 14px, 20px rows. Rebuilt here with hud_teaminfo + a TrueType font.

// --- font: flat glyphs so colours are exact (ezQuake bakes gradients in by default:
//     digits 255 255 150 -> 218 132 7, letters white -> 107 98 86)
font_gradient_normal_color1           "255 255 255"
font_gradient_normal_color2           "255 255 255"
font_gradient_number_color1           "255 255 255"
font_gradient_number_color2           "255 255 255"
// high-bit ("brown") glyphs = the bracket colour, hub .qw-color-b rgb(179,127,58)
font_gradient_alternate_color1        "179 127 58"
font_gradient_alternate_color2        "179 127 58"
font_outline_width                    "1"
// TTF is read from <sys_fontsdir>/Roboto-Bold.ttf on disk (fonts.c FontCreate -> FT_New_Face),
// NOT from the pk3 search path, and $gamedir expands to a name, not a path. So sys_fontsdir
// must be set per machine BEFORE this file runs - see readme.txt. If it is wrong, fontload
// fails quietly and teaminfo falls back to the normal charset.
fontload none
fontload Roboto-Bold

// --- best-weapon names, hub BestWeapon colours (amber-500 / cyan-400 / gray-400), uppercase
set tp_name_rlg                       "&cf90RL&c2deG"
